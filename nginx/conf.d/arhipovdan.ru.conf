# Конфигурация для arhipovdan.ru (FLLanding)
server {
    listen 80;
    server_name arhipovdan.ru www.arhipovdan.ru;

    # Логи
    access_log /var/log/nginx/arhipovdan.ru.access.log main;
    error_log /var/log/nginx/arhipovdan.ru.error.log warn;

    # Проксирование на контейнер FLLanding
    location / {
        proxy_pass http://fllanding:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Статические файлы (кеширование)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://fllanding:80;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

