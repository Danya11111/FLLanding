# Конфигурация для nikitintex.ru
# Замените 'nikitintex-container' на имя вашего контейнера для первого сайта
server {
    listen 80;
    server_name nikitintex.ru www.nikitintex.ru;

    # Логи
    access_log /var/log/nginx/nikitintex.ru.access.log main;
    error_log /var/log/nginx/nikitintex.ru.error.log warn;

    # Проксирование на контейнер первого сайта (порт 3000 для фронтенда)
    # ИЗМЕНИТЕ 'gooddriveweb-app' на реальное имя вашего контейнера
    location / {
        proxy_pass http://gooddrive-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Статические файлы (кеширование)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://gooddrive-app:3000;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

